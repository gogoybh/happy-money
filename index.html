<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Face Tracking & Registration (Pro Version)</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        /* 기존의 편안한 색상 테마 및 기본 초기화 유지 */
        :root {
            --bg-color: #1e272e;
            --panel-bg: #2c3e50;
            --text-color: #ecf0f1;
            --btn-color: #3498db;
            --btn-hover: #2980b9;
            --btn-active: #e67e22;
            --danger-color: #e74c3c;
            --box-color: #00d2d3; 
            --success-color: #2ecc71;
        }
        body {
            margin: 0; 
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .mobile-container {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }

        .menu-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .menu-bar.bottom {
            margin-bottom: 0;
            margin-top: 10px;
            border-bottom: none;
            border-top: 1px solid #34495e;
            padding-top: 10px;
        }
        
        button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            min-width: 80px;
        }
        button:hover:not(:disabled) { background-color: var(--btn-hover); }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; opacity: 0.6; }
        button.active { background-color: var(--btn-active); }
        button.danger { background-color: var(--danger-color); }

        .video-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid transparent;
        }
        
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #bdc3c7;
            text-align: center;
            word-break: keep-all;
            height: 20px;
        }

        /* 등록 패널 스타일 */
        .registration-panel {
            display: none;
            flex-direction: column;
            gap: 10px;
            background-color: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .registration-panel.active {
            display: flex;
        }
        .registration-panel input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #2c3e50;
            color: white;
            font-size: 14px;
        }
        .registration-panel button.submit {
            background-color: var(--success-color);
        }
        .registration-panel button.reset {
            background-color: var(--danger-color);
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="menu-bar">
        <button id="startBtn" disabled>카메라 켜기</button>
        <button id="switchBtn" disabled>전/후면 전환</button>
        <button id="stopBtn" disabled class="danger">끄기</button>
    </div>
    
    <div class="video-wrapper" id="videoWrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>
    
    <div class="menu-bar bottom">
        <button id="faceToggleBtn" class="active">얼굴 추적 (ON)</button>
        <button id="registerToggleBtn">얼굴 등록 (0/20)</button>
    </div>

    <!-- 얼굴 등록 패널 -->
    <div id="registerPanel" class="registration-panel">
        <input type="text" id="personName" placeholder="이름을 입력하세요">
        <input type="file" id="personImage" accept="image/*">
        <button class="submit" onclick="registerFace()">해당 사진으로 이름 등록하기</button>
        <button class="reset" onclick="clearSavedData()">저장된 데이터 모두 초기화</button>
    </div>

    <div id="status">인공지능 모델을 불러오는 중입니다...</div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const switchBtn = document.getElementById('switchBtn');
    const faceToggleBtn = document.getElementById('faceToggleBtn');
    const registerToggleBtn = document.getElementById('registerToggleBtn');
    const registerPanel = document.getElementById('registerPanel');
    const statusText = document.getElementById('status');
    
    let stream = null;
    let mainInterval = null;
    let currentFacingMode = "user"; 

    let isFaceTrackingOn = true;
    
    let labeledDescriptors = [];
    let faceMatcher = null;
    const MAX_PEOPLE = 20;

    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

    // [편의성 극대화] 로컬 스토리지에 등록된 얼굴 데이터 저장 및 불러오기
    function saveToLocalStorage() {
        const data = labeledDescriptors.map(ld => ({
            label: ld.label,
            descriptors: ld.descriptors.map(d => Array.from(d)) // Float32Array를 일반 배열로 변환
        }));
        localStorage.setItem('savedFaces', JSON.stringify(data));
    }

    function loadFromLocalStorage() {
        const dataStr = localStorage.getItem('savedFaces');
        if (dataStr) {
            const data = JSON.parse(dataStr);
            labeledDescriptors = data.map(item => {
                const descriptors = item.descriptors.map(d => new Float32Array(d)); // 다시 Float32Array로 복원
                return new faceapi.LabeledFaceDescriptors(item.label, descriptors);
            });
            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55); // 매칭 감도
                registerToggleBtn.innerText = `얼굴 등록 (${labeledDescriptors.length}/${MAX_PEOPLE})`;
                statusText.innerText = `저장된 얼굴 ${labeledDescriptors.length}명을 불러왔습니다.`;
            }
        }
    }

    // 데이터 초기화 버튼 기능
    function clearSavedData() {
        if(confirm("등록된 모든 사람의 데이터를 삭제하시겠습니까?")) {
            localStorage.removeItem('savedFaces');
            labeledDescriptors = [];
            faceMatcher = null;
            registerToggleBtn.innerText = `얼굴 등록 (0/20)`;
            alert("초기화 완료되었습니다.");
        }
    }

    // 1. 모델 로드 (인식률이 뛰어난 ssdMobilenetv1으로 변경)
    async function initModels() {
        try {
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL), // 높은 정확도의 모델
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);
            loadFromLocalStorage(); // 모델 로드 후 저장된 데이터 불러오기
            statusText.innerText = "시스템 준비 완료! 카메라를 켜주세요.";
            startBtn.disabled = false;
        } catch (error) {
            console.error(error);
            statusText.innerText = "모델 로드 실패. 인터넷을 확인해주세요.";
        }
    }

    // 2. 카메라 시작 함수
    async function startCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            video.srcObject = stream;
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            switchBtn.disabled = false;
            statusText.innerText = currentFacingMode === 'user' ? "전면 카메라 작동 중" : "후면 카메라 작동 중";
        } catch (err) {
            statusText.innerText = "카메라 권한이 차단되었거나 기기를 찾을 수 없습니다.";
        }
    }

    startBtn.addEventListener('click', startCamera);

    // 3. 카메라 전/후면 전환
    switchBtn.addEventListener('click', () => {
        currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
        startCamera();
    });

    // 4. 카메라 끄기
    stopBtn.addEventListener('click', () => {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        clearInterval(mainInterval);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        switchBtn.disabled = true;
        statusText.innerText = "카메라 종료됨.";
    });

    // 5. 패널 토글
    faceToggleBtn.addEventListener('click', () => {
        isFaceTrackingOn = !isFaceTrackingOn;
        faceToggleBtn.innerText = `얼굴 추적 (${isFaceTrackingOn ? 'ON' : 'OFF'})`;
        faceToggleBtn.classList.toggle('active', isFaceTrackingOn);
    });

    registerToggleBtn.addEventListener('click', () => {
        registerPanel.classList.toggle('active');
        registerToggleBtn.classList.toggle('active');
    });

    // 6. 얼굴 등록 기능 (정확도 높은 모델 사용 & 자동 저장)
    async function registerFace() {
        const nameInput = document.getElementById('personName').value.trim();
        const fileInput = document.getElementById('personImage').files[0];

        if (!nameInput || !fileInput) {
            alert("이름과 사진을 모두 선택해주세요.");
            return;
        }

        let existing = labeledDescriptors.find(ld => ld.label === nameInput);
        if (!existing && labeledDescriptors.length >= MAX_PEOPLE) {
            alert(`최대 등록 인원(${MAX_PEOPLE}명)을 초과했습니다.`);
            return;
        }

        statusText.innerText = `${nameInput} 분석 중... 잠시만 기다려주세요.`;

        try {
            const img = await faceapi.bufferToImage(fileInput);
            // SsdMobilenetv1 적용 (정확도 대폭 향상)
            const detection = await faceapi.detectSingleFace(img, new faceapi.SsdMobilenetv1Options())
                                           .withFaceLandmarks()
                                           .withFaceDescriptor();

            if (!detection) {
                alert("사진에서 얼굴을 찾지 못했습니다. 빛이 잘 드는 정면 사진을 시도해주세요.");
                statusText.innerText = "얼굴 등록 실패";
                return;
            }

            if (existing) {
                existing.descriptors.push(detection.descriptor);
            } else {
                labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(nameInput, [detection.descriptor]));
            }

            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
            saveToLocalStorage(); // 변경된 데이터를 브라우저에 저장!

            statusText.innerText = `${nameInput} 등록 및 저장 완료!`;
            registerToggleBtn.innerText = `얼굴 등록 (${labeledDescriptors.length}/${MAX_PEOPLE})`;
            document.getElementById('personName').value = '';
            document.getElementById('personImage').value = '';
            registerPanel.classList.remove('active');
            registerToggleBtn.classList.remove('active');
        } catch (e) {
            console.error(e);
            statusText.innerText = "등록 중 오류가 발생했습니다.";
        }
    }

    // 7. 메인 프로세싱 루프
    video.addEventListener('play', () => {
        const displaySize = { width: video.clientWidth, height: video.clientHeight };
        faceapi.matchDimensions(canvas, displaySize);

        mainInterval = setInterval(async () => {
            if (video.paused || video.ended) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isFaceTrackingOn) {
                // 정확도가 높은 SsdMobilenetv1Options으로 실시간 감지
                const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                                                .withFaceLandmarks()
                                                .withFaceDescriptors();
                                                
                const resizedDetections = faceapi.resizeResults(detections, displaySize);

                resizedDetections.forEach(detection => {
                    const box = detection.detection.box;
                    let label = "알 수 없음";

                    if (faceMatcher) {
                        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                        label = bestMatch.toString();
                    }

                    // [수정됨] 사각형 대신 얼굴 중심을 따라가는 동그라미(Circle) UI 렌더링
                    const centerX = box.x + box.width / 2;
                    const centerY = box.y + box.height / 2;
                    const radius = Math.max(box.width, box.height) / 2 * 1.1; // 얼굴을 충분히 감싸도록 1.1배 여유

                    ctx.strokeStyle = 'var(--box-color)';
                    ctx.lineWidth = 4; // 선 굵기를 약간 키워 시인성 확보
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.stroke();

                    // 이름 라벨 배경 (동그라미 위쪽에 배치)
                    ctx.fillStyle = 'var(--box-color)';
                    const labelWidth = Math.max(box.width, ctx.measureText(label).width + 20);
                    ctx.fillRect(centerX - labelWidth / 2, centerY - radius - 35, labelWidth, 30);
                    
                    // 이름 라벨 텍스트 중앙 정렬
                    ctx.fillStyle = '#1e272e';
                    ctx.font = 'bold 16px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(label, centerX, centerY - radius - 15);
                });
            }
        }, 150);
    });

    window.addEventListener('resize', () => {
        if (video.srcObject) {
            faceapi.matchDimensions(canvas, { width: video.clientWidth, height: video.clientHeight });
        }
    });

    initModels();
</script>
</body>
</html>
