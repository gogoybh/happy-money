<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리집 실시간 가계부 & 스케줄</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        /* --- 공통 테마 변수 (노멀 모드 기본값) --- */
        :root {
            --bg-color: #f4f7f6;
            --surface-color: #ffffff;
            --surface-light: #fafbfc;
            --text-primary: #333333;
            --text-secondary: #777777;
            --accent-color: #5bb4ff;
            --danger-color: #ff6b6b;
            --holiday-color: #ff7b7b;
            --border-color: #e2e8f0;
            --modal-overlay: rgba(0, 0, 0, 0.3);
            --input-bg: #f9fbfc;
            --cal-header: #f8fbff;
            --cal-hover: #f0f7ff;
            --cal-today: #e6f3ff;
            --shadow-color: rgba(0,0,0,0.08);
        }

        /* --- 모던 모드 --- */
        [data-theme="modern"] {
            --bg-color: #e9ecef;
            --surface-color: #ffffff;
            --surface-light: #f8f9fa;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent-color: #339af0;
            --danger-color: #fa5252;
            --holiday-color: #e03131;
            --border-color: #dee2e6;
            --modal-overlay: rgba(0, 0, 0, 0.4);
            --input-bg: #f1f3f5;
            --cal-header: #f8f9fa;
            --cal-hover: #f1f3f5;
            --cal-today: #e7f5ff;
            --shadow-color: rgba(0,0,0,0.1);
        }

        /* --- 다크 모드 --- */
        [data-theme="dark"] {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-light: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent-color: #4db8ff;
            --danger-color: #ff6b6b;
            --holiday-color: #ff8787;
            --border-color: #383838;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --input-bg: #2a2a2a;
            --cal-header: #252525;
            --cal-hover: #333333;
            --cal-today: #1e3a5f;
            --shadow-color: rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            font-size: 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        input, select, textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        .app-window {
            background-color: var(--surface-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            width: 95vw;
            max-width: 900px; 
            height: 92vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* --- 로그인 화면 --- */
        #login-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            display: flex;
            width: 100%;
            max-width: 600px;
            background: var(--surface-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px var(--shadow-color);
        }

        .login-sidebar {
            flex: 1;
            background: var(--surface-light);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            border-right: 1px solid var(--border-color);
        }

        .login-content {
            flex: 1.5;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .app-select-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .app-select-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(91, 180, 255, 0.2);
        }

        /* --- 메뉴바 --- */
        .menu-bar {
            display: flex;
            background-color: var(--surface-color);
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
            flex-shrink: 0; 
            overflow-x: auto;
            align-items: center;
        }

        .sch-nav, .ldg-nav { display: none; }

        .menu-btn {
            flex: 1;
            min-width: 75px;
            box-sizing: border-box;
            background: transparent;
            color: var(--text-secondary);
            border: none; 
            outline: none;
            padding: 12px 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px; 
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
        }

        .menu-btn.active { 
            color: #fff; 
            background-color: var(--accent-color); 
            box-shadow: 0 4px 10px rgba(91, 180, 255, 0.2);
        }

        .home-btn {
            flex: 0 0 auto !important;
            min-width: 45px !important;
            padding: 10px !important;
            background: var(--surface-light) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 50% !important;
            color: var(--accent-color) !important;
            margin-left: 10px;
        }
        .home-btn:hover { filter: brightness(0.95); }

        .content-area {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 0; 
            display: flex;
            flex-direction: column;
        }

        .tab-content { display: none; flex-direction: column; flex: 1; }
        .tab-content.active { display: flex; }

        /* --- 캘린더 바둑판 스타일 --- */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            text-align: center; 
            flex: 1;
            border-top: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            border-radius: 12px; 
            overflow: hidden; 
            background-color: var(--surface-color);
        }
        .cal-header { 
            font-weight: bold; 
            color: var(--text-secondary); 
            padding: 12px 0; 
            font-size: 14px;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--cal-header);
        }
        .cal-day {
            background: var(--surface-color); 
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            min-height: 90px; 
            padding: 4px 0;
            font-size: 14px; 
            display: flex; 
            flex-direction: column;
            align-items: stretch; 
            cursor: pointer; 
            transition: background-color 0.2s;
            overflow: hidden;
        }
        .cal-day:hover { background-color: var(--cal-hover); }
        .cal-day.today { background-color: var(--cal-today); font-weight: bold; }
        
        .holiday-text { color: var(--holiday-color) !important; }

        .sch-cal-item {
            font-size: 11px;
            color: #fff; 
            padding: 4px 6px;
            margin-left: 4px;
            margin-right: 4px;
            border-radius: 6px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        .sch-cal-item.span-middle { border-radius: 0; margin-left: 0 !important; margin-right: -1px !important; z-index: 2; }
        .sch-cal-item.span-start { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: -1px !important; z-index: 2; }
        .sch-cal-item.span-end { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0 !important; z-index: 2; }

        /* --- 모달 --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--modal-overlay); z-index: 1000;
            display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--surface-color); border-radius: 16px; width: 100%;
            max-width: 400px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popIn 0.2s ease-out;
            border: 1px solid var(--border-color);
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; font-size: 18px; color: var(--text-primary); }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); }
        
        .daily-sch-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-light); padding: 12px; border-radius: 10px; margin-bottom: 8px;
            border: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s;
        }
        .daily-sch-item:hover { filter: brightness(0.95); }
        
        .add-schedule-btn {
            width: 100%; background: var(--surface-light); color: var(--accent-color); border: 2px dashed var(--border-color);
            padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: all 0.2s;
        }
        .add-schedule-btn:hover { border-color: var(--accent-color); }

        .trash-btn {
            background: var(--danger-color); color: white; border: none;
            padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
        }

        /* --- 공통 폼 스타일 --- */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight:bold; }
        input[type="text"], input[type="date"], input[type="password"], select {
            width: 100%; background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 10px; box-sizing: border-box; font-size: 15px; outline: none; transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent-color); }

        .submit-btn {
            width: 100%; background: var(--accent-color); color: #fff; border: none; padding: 14px;
            border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; outline: none;
        }

        /* --- 가계부 스타일 --- */
        .month-selector {
            display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px;
            background: var(--surface-color); padding: 12px; border-radius: 12px; box-shadow: 0 2px 10px var(--shadow-color); flex-shrink: 0; font-size: 18px; border: 1px solid var(--border-color);
        }
        .month-selector button { color: var(--text-secondary); font-size: 20px; }
        .summary-card { background-color: var(--surface-color); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow-color);}
        .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; }
        .amount-val { font-weight: bold; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 14px 8px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-secondary); font-weight: bold; background: var(--cal-header); }
        .progress-track { background: var(--border-color); height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .category-item { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--surface-color); padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .cat-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; background-color: var(--surface-light); color: var(--text-primary); }
        .action-btn { padding: 6px 12px; border-radius: 8px; border: none; font-size: 12px; cursor: pointer; color: white; margin-right: 3px; outline: none; font-weight: bold;}
        .edit-btn { background-color: var(--accent-color); }
        .del-btn { background-color: var(--danger-color); }
        .admin-col { display: none; }
        .edit-mode-active .admin-col { display: table-cell; }

        @media (max-width: 600px) {
            .login-container { flex-direction: column; border-radius: 0; height: 100%; max-width: 100%; box-shadow:none; }
            .app-window { width: 100vw; height: 100vh; border-radius: 0; border: none; }
            th, td { padding: 12px 4px; font-size: 13px; }
            .cal-day { min-height: 80px; padding: 2px 0; }
            .sch-cal-item { font-size: 10px; padding: 3px 4px; margin-left: 2px; margin-right: 2px; }
        }
    </style>
</head>
<body>

<div class="app-window">
    <div id="login-screen">
        <div class="login-container">
            <div class="login-sidebar">
                <h2 style="margin-top:0; font-size: 20px; text-align:center; color: var(--text-primary); margin-bottom: 20px;">🏡 메뉴 선택</h2>
                <button class="app-select-btn active" onclick="selectApp('schedule', this)">🗓️ 가족 스케줄</button>
                <button class="app-select-btn" onclick="selectApp('ledger', this)">💰 우리집 가계부</button>
            </div>
            <div class="login-content">
                <h2 id="login-title" style="margin-top:0; margin-bottom: 10px; font-size: 24px; color:var(--accent-color);">🗓️ 가족 스케줄</h2>
                <p id="login-desc" style="color:var(--text-secondary); margin-bottom: 25px; font-size: 14px;">공통 비밀번호 4자리 입력</p>
                <div id="pwd-area" style="display:flex; flex-direction:column; align-items:center; width:100%;">
                    <input type="password" id="pwd-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••" style="width:140px; text-align:center; font-size:26px; letter-spacing:8px;" onkeydown="if(event.key==='Enter') checkLogin()">
                    <button class="submit-btn" style="width:140px; margin-top:20px; border-radius:12px;" onclick="checkLogin()">접속하기</button>
                </div>
                <!-- 화면 테마 변경 버튼 -->
                <button id="theme-toggle-btn" onclick="toggleTheme()" style="margin-top:40px; background:var(--surface-light); color:var(--text-secondary); border:1px solid var(--border-color); padding:8px 16px; border-radius:20px; font-size:13px; cursor:pointer; font-weight:bold; transition:all 0.2s;">🎨 모드: 노멀</button>
            </div>
        </div>
    </div>

    <div class="menu-bar">
        <!-- 스케줄 메뉴 -->
        <button class="menu-btn sch-nav" id="btn-sch-cal" onclick="switchTab('sch-cal', this)">달력 모드</button>
        <button class="menu-btn sch-nav" id="btn-sch-list" onclick="switchTab('sch-list', this)">목록 모드</button>

        <!-- 가계부 메뉴 -->
        <button class="menu-btn ldg-nav" id="btn-dashboard" onclick="switchTab('dashboard', this)">현황</button>
        <button class="menu-btn ldg-nav" id="btn-expense" onclick="switchTab('expense-add', this)">지출등록</button>
        <button class="menu-btn ldg-nav" id="btn-history" onclick="switchTab('history', this)">내역</button>
        <button class="menu-btn ldg-nav" id="btn-fixed" onclick="switchTab('fixed-expense', this)">고정지출</button>
        <button class="menu-btn ldg-nav" id="btn-settings" onclick="switchTab('settings', this)">설정</button>

        <div style="flex:1;"></div>
        <button class="menu-btn home-btn" onclick="goHome()" title="첫 화면으로">🏠</button>
    </div>

    <div class="content-area">
        <!-- ================= [ 스케줄: 달력 모드 ] ================= -->
        <div id="sch-cal" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px; padding:0 5px;">
                <button onclick="changeSchMonth(-1)" style="background:var(--surface-color); border:1px solid var(--border-color); color:var(--text-primary); padding:8px 16px; border-radius:10px; cursor:pointer; font-weight:bold; box-shadow:0 2px 4px var(--shadow-color);">◀</button>
                <strong id="sch-display-month" style="font-size:20px; color:var(--text-primary);">2026. 08</strong>
                <button onclick="changeSchMonth(1)" style="background:var(--surface-color); border:1px solid var(--border-color); color:var(--text-primary); padding:8px 16px; border-radius:10px; cursor:pointer; font-weight:bold; box-shadow:0 2px 4px var(--shadow-color);">▶</button>
            </div>
            
            <div class="calendar-grid">
                <div class="cal-header holiday-text">일</div><div class="cal-header">월</div><div class="cal-header">화</div><div class="cal-header">수</div><div class="cal-header">목</div><div class="cal-header">금</div><div class="cal-header" style="color:var(--accent-color);">토</div>
                <div id="cal-days" style="display:contents;"></div>
            </div>
        </div>

        <!-- ================= [ 스케줄: 목록 모드 ] ================= -->
        <div id="sch-list" class="tab-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h3 style="margin:0;">이번 달 전체 일정</h3>
                <div style="display:flex; gap:6px;">
                    <button onclick="document.getElementById('sch-csv-file').click()" style="background:var(--surface-color); color:var(--text-secondary); border:1px solid var(--border-color); padding:8px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:bold;">가져오기</button>
                    <input type="file" id="sch-csv-file" accept=".csv" style="display:none;" onchange="importSchCSV(this)">
                    <button onclick="exportSchCSV()" style="background:var(--accent-color); color:white; border:none; padding:8px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:bold;">다운받기</button>
                </div>
            </div>
            <div id="schedule-list-container" style="flex:1; overflow-y:auto; padding-right:5px;"></div>
        </div>

        <!-- ================= [ 가계부 탭들 ] ================= -->
        <div class="month-selector" id="month-nav" style="display:none;">
            <button onclick="changeMonth(-1)" style="background:none; border:none; cursor:pointer;">◀</button>
            <strong id="display-month">2026. 08</strong>
            <button onclick="changeMonth(1)" style="background:none; border:none; cursor:pointer;">▶</button>
        </div>

        <div id="dashboard" class="tab-content">
            <div class="summary-card">
                <div class="summary-row"><span>예산 총액</span><span id="stat-total-budget" class="amount-val">0원</span></div>
                <div class="summary-row"><span>총 지출</span><span id="stat-expense" class="amount-val" style="color:var(--danger-color)">0원</span></div>
                <hr style="border:0; border-top:1px dashed var(--border-color); margin:12px 0;">
                <div class="summary-row"><span>남은 예산</span><strong id="stat-remain" class="amount-val" style="font-size:1.2em; color:var(--accent-color);">0원</strong></div>
            </div>
            <div class="summary-card" style="padding:10px 20px;">
                <table id="budget-table">
                    <thead><tr><th>항목</th><th>사용 / 예산</th><th>잔액</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="expense-add" class="tab-content">
            <div class="summary-card">
                <h3 id="form-title" style="margin-top:0; font-size: 18px; margin-bottom: 20px;">💰 지출 기록</h3>
                <input type="hidden" id="edit-id">
                <div class="form-group"><label>날짜</label><input type="date" id="exp-date"></div>
                <div class="form-group"><label>항목</label><select id="exp-category"></select></div>
                <div class="form-group"><label>내용</label><input type="text" id="exp-note" placeholder="어디서 썼나요?"></div>
                <div class="form-group">
                    <label>금액</label>
                    <input type="text" id="exp-amount" inputmode="numeric" placeholder="0" oninput="inputFormatting(this)" style="font-weight:bold; color:var(--danger-color);">
                </div>
                <button class="submit-btn" id="save-btn" onclick="saveTransaction()">지출 저장</button>
                <button class="submit-btn" id="cancel-btn" style="background:var(--surface-light); color:var(--text-primary); display:none; margin-top:10px; border:1px solid var(--border-color);" onclick="cancelEdit()">수정 취소</button>
            </div>
        </div>

        <div id="history" class="tab-content">
            <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:15px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <h3 style="margin:0; font-size: 18px;">월간 내역</h3>
                        <button id="toggle-edit-btn" onclick="toggleEditMode()" style="background:var(--surface-color); color:var(--text-secondary); border:1px solid var(--border-color); padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:bold;">편집</button>
                    </div>

<script>
    /* ----------------------------------------------------
       1. FIREBASE 설정
    ---------------------------------------------------- */
    const firebaseConfig = {
        apiKey: "AIzaSyAHUwiRjqz4__6529TbXBq4tiRT5YJPNiQ",
        authDomain: "happy-money-1f688.firebaseapp.com",
        databaseURL: "https://happy-money-1f688-default-rtdb.firebaseio.com",
        projectId: "happy-money-1f688",
        storageBucket: "happy-money-1f688.firebasestorage.app",
        messagingSenderId: "75003891526",
        appId: "1:75003891526:web:611a550413c590c06d1f47"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    /* ----------------------------------------------------
       2. 상태 및 기본 데이터
    ---------------------------------------------------- */
    let isLoggedIn = false; 

    let isEditMode = false;
    let isFixedEditMode = false; 
    let isCatEditMode = false; // 카테고리 편집 모드 변수 추가
    let editingFixedId = null;   

    let currentDate = new Date();
    let currentSchDate = new Date(); 
    let selectedCalDate = ""; 

    let categories = [];
    let transactions = [];
    let schedules = []; 
    let fixedSalary = 0;
    let fixedExpenses = [];

    const catColors = ['#ff8787', '#74c0fc', '#fcc419', '#8ce200', '#ffa94d', '#e599f7', '#63e6be', '#ff8787'];
    const memberColors = {
        '아빠': '#74c0fc', '엄마': '#63e6be', '하은': '#eebefa', '성준': '#ffd8a8', '가족전체': '#ffa8a8'
    };
    
    const fallbackHolidays = {
        '01-01': '신정', '03-01': '3·1절', '05-05': '어린이날', '06-06': '현충일',
        '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절'
    };

    const format = (n) => Number(n).toLocaleString() + '원';
    const parseFormatted = (str) => parseInt(String(str).replace(/,/g, "")) || 0;
    function hexToRgba(hex, alpha) {
        if (!hex || hex[0] !== '#') return `rgba(255, 255, 255, ${alpha})`;
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    const defaultCats = [
        { id: 1, name: '식재료', budget: 1000000, textColor: 'var(--text-primary)', borderColor: '#ff8787' },
        { id: 2, name: '외식', budget: 300000, textColor: 'var(--text-primary)', borderColor: '#74c0fc' },
        { id: 3, name: '보험금', budget: 500000, textColor: 'var(--text-primary)', borderColor: '#fcc419' }
    ];

    /* ----------------------------------------------------
       3. 테마 및 로컬 스토리지 관리
    ---------------------------------------------------- */
    const themes = ['normal', 'modern', 'dark'];
    let currentThemeIndex = 0;

    function loadTheme() {
        const saved = localStorage.getItem('appTheme') || 'normal';
        currentThemeIndex = themes.indexOf(saved);
        if(currentThemeIndex === -1) currentThemeIndex = 0;
        applyTheme();
    }

    function toggleTheme() {
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        applyTheme();
    }

    function applyTheme() {
        const theme = themes[currentThemeIndex];
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('appTheme', theme);
        
        const btn = document.getElementById('theme-toggle-btn');
        if(btn) {
            let themeName = theme === 'normal' ? '노멀' : (theme === 'modern' ? '모던' : '다크');
            btn.innerText = `🎨 모드: ${themeName}`;
        }
        refreshUI();
    }

    /* ----------------------------------------------------
       4. 외부 API 기반 동적 휴일 로딩 (음력 명절 자동계산)
    ---------------------------------------------------- */
    let fetchedYears = new Set();
    let dynamicHolidays = {}; 

    async function loadHolidaysForYear(year) {
        if(fetchedYears.has(year)) return;
        try {
            const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
            if(response.ok) {
                const data = await response.json();
                data.forEach(h => {
                    let kName = h.localName; 
                    if(h.name.includes("Alternative") || h.localName.includes("대체")) kName = "대체공휴일";
                    dynamicHolidays[h.date] = kName;
                });
                fetchedYears.add(year);
                renderCalendar(); 
            }
        } catch(error) {
            console.error("공휴일 데이터 로딩 실패. 기본 공휴일로 대체됩니다.", error);
        }
    }

    /* ----------------------------------------------------
       5. DB 연동 리스너
    ---------------------------------------------------- */
    db.ref('categories').on('value', snap => { categories = snap.val() ? Object.values(snap.val()) : defaultCats; refreshUI(); });
    db.ref('transactions').on('value', snap => { transactions = snap.val() ? Object.values(snap.val()) : []; refreshUI(); });
    db.ref('fixed_salary').on('value', snap => {
        fixedSalary = snap.val() || 0;
        const inputEl = document.getElementById('fixed-salary-input');
        if (document.activeElement !== inputEl) inputEl.value = fixedSalary ? Number(fixedSalary).toLocaleString() : '';
        renderFixedExpenses();
    });
    db.ref('fixed_expenses').on('value', snap => { fixedExpenses = snap.val() ? Object.values(snap.val()) : []; renderFixedExpenses(); });
    db.ref('schedules').on('value', snap => {
        schedules = snap.val() ? Object.values(snap.val()) : [];
        renderCalendar();
        renderScheduleList();
        if(document.getElementById('daily-modal').style.display === 'flex' && selectedCalDate) {
            openDailyView(selectedCalDate); 
        }
    });

    /* ----------------------------------------------------
       6. 로그인 및 앱 분리 (세션 유지 적용)
    ---------------------------------------------------- */
    let targetHash = "827d5449d1f191275051481e75c4ce10e930a64b5585a546363c340d63347089";
    (async function() {
        const secret = atob("MDUwOQ=="); 
        const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secret));
        targetHash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    })();
    
    let targetApp = 'schedule'; 
    
    function selectApp(app, btn) {
        targetApp = app;
        document.querySelectorAll('.app-select-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('login-title').innerText = app === 'schedule' ? '🗓️ 가족 스케줄' : '💰 우리집 가계부';

        if (isLoggedIn) enterApp();
    }

    async function checkLogin() {
        const pwd = document.getElementById('pwd-input').value.trim();
        if(!pwd) return;
        const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
        const inputHash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

        if(inputHash === targetHash) {
            isLoggedIn = true; 
            document.getElementById('pwd-area').style.display = 'none';
            document.getElementById('login-desc').innerText = "원하시는 메뉴를 눌러 바로 진입하세요.";
            enterApp();
        } else {
            alert('비밀번호가 틀렸습니다.');
            document.getElementById('pwd-input').value = '';
        }
    }

    function enterApp() {
        document.getElementById('login-screen').style.display = 'none';
        if(targetApp === 'schedule') {
            currentSchDate = new Date(); 
            document.querySelectorAll('.ldg-nav').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.sch-nav').forEach(el => el.style.display = 'block');
            switchTab('sch-cal', document.getElementById('btn-sch-cal'));
        } else {
            currentDate = new Date(); 
            document.querySelectorAll('.sch-nav').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.ldg-nav').forEach(el => el.style.display = 'block');
            switchTab('dashboard', document.getElementById('btn-dashboard'));
        }
    }

    function goHome() {
        document.getElementById('login-screen').style.display = 'flex';
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
        document.getElementById('month-nav').style.display = (id === 'dashboard' || id === 'history') ? 'flex' : 'none';
        if(isEditMode) toggleEditMode();
        if(isFixedEditMode) toggleFixedEditMode();
        refreshUI();
        if(targetApp === 'schedule') { renderCalendar(); renderScheduleList(); }
    }

    /* ----------------------------------------------------
       [스케줄 모달 컨트롤 로직]
    ---------------------------------------------------- */
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openDailyView(dateStr) {
        selectedCalDate = dateStr;
        document.getElementById('daily-modal-title').innerText = dateStr.replace(/-/g, '. ');
        const daySchedules = schedules.filter(s => {
            const st = s.startDate || s.date;
            const ed = s.endDate || s.date;
            return dateStr >= st && dateStr <= ed;
        });
        const listEl = document.getElementById('daily-schedule-list');
        if(daySchedules.length === 0) {
            listEl.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:20px;">등록된 일정이 없습니다.</div>`;
        } else {
            listEl.innerHTML = daySchedules.map(s => {
                const color = memberColors[s.member] || '#ccc';
                return `
                <div class="daily-sch-item" style="border-left: 5px solid ${color};" onclick="editSchedule(${s.id})">
                    <div>
                        <span class="cat-badge" style="background:${color}; color:#fff;">${s.member}</span>
                        <span style="font-size:15px; font-weight:bold; margin-left:6px; color:var(--text-primary);">${s.content}</span>
                    </div>
                </div>`;
            }).join('');
        }
        openModal('daily-modal');
    }

    function openSchForm() {
        closeModal('daily-modal');
        document.getElementById('sch-edit-id').value = "";
        document.getElementById('sch-start-date').value = selectedCalDate;
        document.getElementById('sch-end-date').value = selectedCalDate;
        document.getElementById('sch-member').value = "아빠";
        document.getElementById('sch-content').value = "";
        document.getElementById('sch-form-title').innerText = "✨ 새 일정 등록";
        document.getElementById('sch-delete-btn').style.display = "none";
        openModal('sch-form-modal');
    }

    function editSchedule(id) {
        closeModal('daily-modal');
        const s = schedules.find(x => x.id == id);
        if(!s) return;
        document.getElementById('sch-edit-id').value = s.id;
        document.getElementById('sch-start-date').value = s.startDate || s.date;
        document.getElementById('sch-end-date').value = s.endDate || s.date;
        document.getElementById('sch-member').value = s.member;
        document.getElementById('sch-content').value = s.content;
        document.getElementById('sch-form-title').innerText = "✏️ 일정 수정";
        document.getElementById('sch-delete-btn').style.display = "flex"; 
        openModal('sch-form-modal');
    }

    function saveSchedule() {
        const editId = document.getElementById('sch-edit-id').value;
        const startDate = document.getElementById('sch-start-date').value;
        const endDate = document.getElementById('sch-end-date').value;
        const member = document.getElementById('sch-member').value;
        const content = document.getElementById('sch-content').value.trim();

        if(!startDate || !endDate || !content) return alert('기간과 내용을 정확히 입력하세요.');
        if(startDate > endDate) return alert('시작일이 종료일보다 클 수 없습니다.');

        const id = editId || Date.now();
        db.ref('schedules/' + id).set({ id, date: startDate, startDate, endDate, member, content })
            .then(() => { closeModal('sch-form-modal'); });
    }

    function deleteScheduleFromForm() {
        const id = document.getElementById('sch-edit-id').value;
        if(id && confirm('이 일정을 삭제할까요?')) {
            db.ref('schedules/' + id).remove().then(() => closeModal('sch-form-modal'));
        }
    }

    /* ----------------------------------------------------
       [가족 스케줄: 캘린더 바 연속 연결 & 휴일 텍스트 렌더링]
    ---------------------------------------------------- */
    function changeSchMonth(val) {
        currentSchDate.setMonth(currentSchDate.getMonth() + val);
        renderCalendar();
        renderScheduleList();
    }

    function renderCalendar() {
        const year = currentSchDate.getFullYear();
        const month = currentSchDate.getMonth();
        document.getElementById('sch-display-month').innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
        
        if(!fetchedYears.has(year)) loadHolidaysForYear(year);

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        let html = '';
        
        for(let i=0; i<firstDay; i++) html += `<div class="cal-day" style="background:var(--surface-light); border-bottom:none; border-right:none;"></div>`;
        const todayStr = new Date().toISOString().split('T')[0];
        
        let sortedSchedules = [...schedules].sort((a,b) => {
            const aSt = a.startDate || a.date;
            const bSt = b.startDate || b.date;
            if(aSt !== bSt) return aSt.localeCompare(bSt);
            const aEd = a.endDate || a.date;
            const bEd = b.endDate || b.date;
            if(aEd !== bEd) return bEd.localeCompare(aEd);
            return a.id - b.id;
        });
        
        for(let i=1; i<=lastDate; i++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const isToday = (dateStr === todayStr);
            const dayOfWeek = new Date(year, month, i).getDay();
            const MM_DD = dateStr.substring(5);
            
            const holidayName = dynamicHolidays[dateStr] || fallbackHolidays[MM_DD];
            const isHoliday = (dayOfWeek === 0 || holidayName);
            const colorClass = isHoliday ? 'holiday-text' : '';

            const holidayHtml = holidayName ? `<div class="holiday-text" style="font-size:11px; font-weight:bold; margin-bottom:2px; text-align:center;">${holidayName}</div>` : '';

            const daySchedules = sortedSchedules.filter(s => {
                const st = s.startDate || s.date;
                const ed = s.endDate || s.date;
                return dateStr >= st && dateStr <= ed;
            });

            let itemsHtml = '<div style="display:flex; flex-direction:column; width:100%;">';
            daySchedules.forEach(s => {
                const color = memberColors[s.member] || '#ccc';
                const st = s.startDate || s.date;
                const ed = s.endDate || s.date;
                
                let isStart = (dateStr === st) || (dayOfWeek === 0 && st < dateStr); 
                let isEnd = (dateStr === ed) || (dayOfWeek === 6 && ed > dateStr); 
                
                let spanClass = '';
                if (st !== ed) {
                    if (isStart && !isEnd) spanClass = 'span-start';
                    else if (!isStart && !isEnd) spanClass = 'span-middle';
                    else if (!isStart && isEnd) spanClass = 'span-end';
                }

                let displayContent = (dateStr === st || dayOfWeek === 0) ? s.content : '&nbsp;';
                itemsHtml += `<div class="sch-cal-item ${spanClass}" style="background-color:${color};">${displayContent}</div>`;
            });
            itemsHtml += '</div>';

            html += `<div class="cal-day ${isToday ? 'today' : ''}" onclick="openDailyView('${dateStr}')">
                        <span class="${colorClass}" style="margin-bottom:2px; text-align:center; display:block;">${i}</span>
                        ${holidayHtml}
                        ${itemsHtml}
                     </div>`;
        }
        document.getElementById('cal-days').innerHTML = html;
    }

    function renderScheduleList() {
        const year = currentSchDate.getFullYear();
        const month = String(currentSchDate.getMonth() + 1).padStart(2,'0');
        const monthPrefix = `${year}-${month}`;
        let filtered = schedules.filter(s => {
            const st = s.startDate || s.date;
            const ed = s.endDate || s.date;
            return (st.startsWith(monthPrefix) || ed.startsWith(monthPrefix) || (st < monthPrefix + '-01' && ed > monthPrefix + '-31'));
        });
        filtered.sort((a,b) => new Date(a.startDate || a.date) - new Date(b.startDate || b.date));
        
        const listEl = document.getElementById('schedule-list-container');
        if(filtered.length === 0) {
            listEl.innerHTML = '<div class="category-item" style="justify-content:center; color:var(--text-secondary);">이번 달 등록된 스케줄이 없습니다.</div>';
            return;
        }
        listEl.innerHTML = filtered.map(s => {
            const mColor = memberColors[s.member] || '#ccc';
            const st = s.startDate || s.date;
            const ed = s.endDate || s.date;
            const dateStrDisplay = (st === ed) ? st : `${st} ~ ${ed}`;
            
            return `
            <div class="category-item" style="border-left: 5px solid ${mColor}; justify-content: space-between; cursor:pointer;" onclick="editSchedule(${s.id})">
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-weight:bold; color:var(--text-primary); font-size:14px;">${dateStrDisplay}</span>
                        <span class="cat-badge" style="background-color:${mColor}; color:#fff;">${s.member}</span>
                    </div>
                    <span style="font-size:15px; font-weight:bold; color:var(--text-primary);">${s.content}</span>
                </div>
            </div>`;
        }).join('');
    }

    function exportSchCSV() {
        if(schedules.length === 0) return alert('출력할 데이터가 없습니다.');
        let csv = "\uFEFF시작일,종료일,대상,내용\n";
        schedules.forEach(s => { csv += `${s.startDate||s.date},${s.endDate||s.date},${s.member},${s.content.replace(/,/g, '')}\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
        link.download = `가족스케줄_전체.csv`; link.click();
    }
    function importSchCSV(input) {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            for(let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if(parts.length < 4) continue;
                const id = Date.now() + Math.floor(Math.random()*1000);
                db.ref('schedules/' + id).set({ id, date: parts[0].trim(), startDate: parts[0].trim(), endDate: parts[1].trim(), member: parts[2].trim(), content: parts[3].trim() });
            }
            alert('일정이 병합되었습니다.'); input.value = "";
        };
        reader.readAsText(file);
    }

    /* ----------------------------------------------------
       가계부 관련 로직
    ---------------------------------------------------- */
    function changeMonth(val) { currentDate.setMonth(currentDate.getMonth() + val); refreshUI(); }
    function inputFormatting(el) { let v = el.value.replace(/[^0-9]/g, ""); el.value = v ? Number(v).toLocaleString() : ""; }
    
    function saveTransaction() {
        const editId = document.getElementById('edit-id').value;
        const date = document.getElementById('exp-date').value;
        const note = document.getElementById('exp-note').value;
        const amount = parseFormatted(document.getElementById('exp-amount').value);
        const catId = parseInt(document.getElementById('exp-category').value);
        if(!date || amount <= 0) return alert('정확한 데이터를 입력하세요.');
        const id = editId || Date.now();
        db.ref('transactions/' + id).set({ id, date, note, amount, catId }).then(() => { cancelEdit(); switchTab('history', document.getElementById('btn-history')); });
    }
    function deleteTransaction(id) { if(confirm('삭제하시겠습니까?')) db.ref('transactions/' + id).remove(); }
    
    // ------ [고정 지출 편집 관리] ------ //
    function saveFixedSalary(val) { db.ref('fixed_salary').set(parseFormatted(val)); }
    function addFixedExpense() {
        const name = document.getElementById('new-fixed-name').value.trim();
        const amount = parseFormatted(document.getElementById('new-fixed-amount').value);
        if(!name || amount <= 0) return alert('항목과 금액을 입력하세요.');
        const id = Date.now();
        db.ref('fixed_expenses/' + id).set({ id, name, amount }).then(() => { document.getElementById('new-fixed-name').value = ''; document.getElementById('new-fixed-amount').value = ''; });
    }
    function toggleFixedEditMode() {
        isFixedEditMode = !isFixedEditMode;
        const btn = document.getElementById('toggle-fixed-edit-btn');
        const addForm = document.getElementById('fixed-add-form');
        const salaryInput = document.getElementById('fixed-salary-input');

        if (isFixedEditMode) { 
            btn.innerText = '완료'; 
            btn.style.background = 'var(--accent-color)'; 
            btn.style.color = '#fff'; 
            addForm.style.display = 'flex';
            salaryInput.removeAttribute('readonly');
            salaryInput.style.background = 'var(--input-bg)';
            salaryInput.style.border = '1px solid var(--border-color)';
            salaryInput.style.borderRadius = '8px';
        } else { 
            btn.innerText = '편집'; 
            btn.style.background = 'var(--surface-color)'; 
            btn.style.color = 'var(--text-secondary)'; 
            addForm.style.display = 'none';
            salaryInput.setAttribute('readonly', 'true');
            salaryInput.style.background = 'transparent';
            salaryInput.style.border = 'none';
            editingFixedId = null; 
        }
        renderFixedExpenses();
    }
    function startInlineFixedEdit(id) { editingFixedId = id; renderFixedExpenses(); }
    function cancelInlineFixedEdit() { editingFixedId = null; renderFixedExpenses(); }
    function saveInlineFixedExpense(id) {
        const name = document.getElementById(`inline-fixed-name-${id}`).value.trim();
        const amount = parseFormatted(document.getElementById(`inline-fixed-amount-${id}`).value);
        if(!name || amount <= 0) return alert('입력 오류');
        db.ref('fixed_expenses/' + id).update({ name, amount }).then(() => { editingFixedId = null; });
    }
    function deleteFixedExpense(id) { if(confirm('삭제할까요?')) db.ref('fixed_expenses/' + id).remove(); }
    
    function renderFixedExpenses() {
        const list = document.getElementById('fixed-list');
        let totalFixed = 0;
        list.innerHTML = fixedExpenses.map(f => {
            totalFixed += f.amount;
            if (editingFixedId === f.id) {
                return `<div class="category-item" style="border-left:5px solid var(--accent-color); justify-content:space-between;">
                    <div style="display:flex; gap:8px; flex:1; flex-wrap:wrap;">
                        <input type="text" id="inline-fixed-name-${f.id}" value="${f.name}" style="flex:1; padding:8px;">
                        <input type="text" id="inline-fixed-amount-${f.id}" value="${Number(f.amount).toLocaleString()}" inputmode="numeric" oninput="inputFormatting(this)" style="width:100px; padding:8px; text-align:right;">
                    </div>
                    <div style="display:flex; gap:4px; margin-left:8px;">
                        <button onclick="saveInlineFixedExpense(${f.id})" class="action-btn" style="background:var(--accent-color);">저장</button>
                        <button onclick="cancelInlineFixedEdit()" class="action-btn" style="background:var(--border-color); color:var(--text-primary);">취소</button>
                    </div>
                </div>`;
            } else {
                return `<div class="category-item" style="border-left:5px solid var(--danger-color); justify-content:space-between;">
                    <span style="font-weight:bold;">${f.name}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="color:var(--danger-color); font-weight:bold;">-${format(f.amount)}</span>
                        ${isFixedEditMode ? `
                        <div style="display:flex; gap:4px;">
                            <button class="action-btn edit-btn" onclick="startInlineFixedEdit(${f.id})">수정</button>
                            <button class="action-btn del-btn" onclick="deleteFixedExpense(${f.id})">삭제</button>
                        </div>` : ''}
                    </div>
                </div>`;
            }
        }).join('');
        document.getElementById('fixed-total').innerText = format(totalFixed);
        document.getElementById('fixed-remain').innerText = format(fixedSalary - totalFixed);
        const percent = fixedSalary > 0 ? ((totalFixed / fixedSalary) * 100).toFixed(1) : 0;
        document.getElementById('fixed-percent').innerText = `${percent}%`;
    }

    // ------ [카테고리 편집 관리] ------ //
    function toggleCatEditMode() {
        isCatEditMode = !isCatEditMode;
        const btn = document.getElementById('toggle-cat-edit-btn');
        const addForm = document.getElementById('cat-add-form');
        const saveBtn = document.getElementById('cat-save-btn');

        if (isCatEditMode) {
            btn.innerText = '완료';
            btn.style.background = 'var(--accent-color)';
            btn.style.color = '#fff';
            addForm.style.display = 'flex';
            saveBtn.style.display = 'block';
        } else {
            btn.innerText = '편집';
            btn.style.background = 'var(--surface-color)';
            btn.style.color = 'var(--text-secondary)';
            addForm.style.display = 'none';
            saveBtn.style.display = 'none';
            saveCategories(true); // 완료 누를때 자동 DB 저장
        }
        renderSettings();
    }

    function saveCategories(silent = false) { 
        db.ref('categories').set(categories).then(() => {
            if(!silent) alert('저장되었습니다.');
        }); 
    }
    
    function addCategory() {
        const name = document.getElementById('new-cat-name').value;
        if(!name) return;
        const color = catColors[categories.length % catColors.length];
        categories.push({ id: Date.now(), name, budget: 0, textColor: 'var(--text-primary)', borderColor: color });
        document.getElementById('new-cat-name').value = '';
        renderSettings();
    }
    
    function deleteCat(id) { if(confirm('삭제하시겠습니까?')) { categories = categories.filter(c => c.id !== id); renderSettings(); } }

    function updateCatName(id, val) { const c = categories.find(c => c.id === id); if(c && val.trim()) c.name = val.trim(); }
    function updateCatData(id, val) { const c = categories.find(c => c.id === id); if(c) c.budget = parseFormatted(val); }
    function updateCatProp(id, prop, val) { const c = categories.find(c => c.id === id); if(c) c[prop] = val; }

    function renderSettings() {
        document.getElementById('category-list').innerHTML = categories.map((c, i) => {
            const bColor = c.borderColor || catColors[i % catColors.length];
            if (isCatEditMode) {
                return `<div class="category-item" style="border-left: 5px solid ${bColor}; justify-content:space-between;">
                    <div style="display:flex; gap:8px; flex:1; align-items:center;">
                        <input type="text" value="${c.name}" style="width:100px; padding:8px; font-weight:bold; background:var(--input-bg); color:var(--text-primary); border:1px solid var(--border-color); border-radius:6px;" onchange="updateCatName(${c.id}, this.value)">
                        <input type="color" value="${bColor}" onchange="updateCatProp(${c.id}, 'borderColor', this.value)" style="width:30px; height:30px; border:none; cursor:pointer; background:none;">
                    </div>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="text" value="${Number(c.budget).toLocaleString()}" inputmode="numeric" style="width:100px; padding:8px; text-align:right; background:var(--input-bg); color:var(--text-primary); border:1px solid var(--border-color); border-radius:6px;" oninput="inputFormatting(this); updateCatData(${c.id}, this.value)">
                        <button onclick="deleteCat(${c.id})" class="action-btn del-btn" style="padding:8px 12px; border-radius:6px;">삭제</button>
                    </div>
                </div>`;
            } else {
                return `<div class="category-item" style="border-left: 5px solid ${bColor}; justify-content:space-between;">
                    <span style="font-weight:bold; font-size:15px; padding:8px;">${c.name}</span>
                    <span style="font-weight:bold; font-size:15px; padding:8px; color:var(--text-secondary);">${Number(c.budget).toLocaleString()}원</span>
                </div>`;
            }
        }).join('');
    }

    // ------ [기타 가계부 렌더링 로직] ------ //
    function refreshUI() {
        const year = currentDate.getFullYear();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        const monthStr = `${year}-${month}`;
        document.getElementById('display-month').innerText = `${year}. ${month}`;
        updateDashboard(monthStr);
        updateHistory(monthStr);
        renderSettings();
        initCategorySelect();
    }
    
    function updateDashboard(monthStr) {
        const filtered = transactions.filter(t => t.date.startsWith(monthStr));
        const totalExp = filtered.reduce((a, b) => a + b.amount, 0);
        const totalBudget = categories.reduce((a, b) => a + b.budget, 0);
        document.getElementById('stat-total-budget').innerText = format(totalBudget);
        document.getElementById('stat-expense').innerText = format(totalExp);
        document.getElementById('stat-remain').innerText = format(totalBudget - totalExp);
        document.querySelector('#budget-table tbody').innerHTML = categories.map((c, idx) => {
            const spent = filtered.filter(t => t.catId === c.id).reduce((a, b) => a + b.amount, 0);
            const remain = c.budget - spent;
            const per = c.budget > 0 ? Math.min((spent/c.budget)*100, 100) : (spent > 0 ? 100 : 0);
            const bColor = c.borderColor || catColors[idx % catColors.length];
            return `<tr style="background-color: ${hexToRgba(bColor, 0.05)};">
                <td style="font-weight: bold;">${c.name}
                    <div class="progress-track"><div class="progress-fill" style="width:${per}%; background:${spent > c.budget ? 'var(--danger-color)': bColor}"></div></div>
                </td>
                <td>${format(spent)}<br><small style="color:var(--text-secondary)">/ ${format(c.budget)}</small></td>
                <td style="color:${remain < 0 ? 'var(--danger-color)' : 'inherit'}; font-weight: bold;">${format(remain)}</td>
            </tr>`;
        }).join('');
    }
    
    function updateHistoryOnly() { updateHistory(`${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}`); }
    
    function updateHistory(monthStr) {
        const filterVal = document.getElementById('history-filter').value;
        let filtered = transactions.filter(t => t.date.startsWith(monthStr));
        if (filterVal !== 'all') filtered = filtered.filter(t => t.catId == filterVal);
        filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
        document.querySelector('#history-table tbody').innerHTML = filtered.map(t => {
            const cat = categories.find(c => c.id === t.catId);
            const bColor = cat?.borderColor || catColors[0];
            return `<tr style="background-color: ${hexToRgba(bColor, 0.03)};">
                <td>${t.date.slice(5)}</td>
                <td><span style="font-size: 15px; font-weight:bold;">${t.note}</span><br><span class="cat-badge" style="background: ${hexToRgba(bColor,0.2)}; color:var(--text-primary);">${cat?.name || '미지정'}</span></td>
                <td style="color:var(--danger-color); font-weight:bold;">-${format(t.amount)}</td>
                <td class="admin-col">
                    <button class="action-btn edit-btn" onclick="startEdit(${t.id})">수정</button>
                    <button class="action-btn del-btn" onclick="deleteTransaction(${t.id})">삭제</button>
                </td>
            </tr>`;
        }).join('');
    }

    function initCategorySelect() {
        const opts = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('exp-category').innerHTML = opts;
        const filter = document.getElementById('history-filter');
        const cur = filter.value;
        filter.innerHTML = '<option value="all">전체 항목</option>' + opts;
        if(cur && categories.find(c => c.id == cur)) filter.value = cur;
    }
    
    function toggleEditMode() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('toggle-edit-btn');
        if (isEditMode) {
            document.getElementById('history-table').classList.add('edit-mode-active');
            btn.innerText = '완료'; btn.style.background = 'var(--accent-color)'; btn.style.color = '#fff';
        } else {
            document.getElementById('history-table').classList.remove('edit-mode-active');
            btn.innerText = '편집'; btn.style.background = 'var(--surface-color)'; btn.style.color = 'var(--text-secondary)';
        }
    }
    
    function startEdit(id) {
        const t = transactions.find(item => item.id == id);
        if(!t) return;
        document.getElementById('edit-id').value = t.id;
        document.getElementById('exp-date').value = t.date;
        document.getElementById('exp-note').value = t.note;
        document.getElementById('exp-amount').value = Number(t.amount).toLocaleString();
        document.getElementById('exp-category').value = t.catId;
        document.getElementById('form-title').innerText = "✏️ 내역 수정";
        document.getElementById('save-btn').innerText = "수정 완료";
        document.getElementById('cancel-btn').style.display = "block";
        switchTab('expense-add', document.getElementById('btn-expense'));
    }
    
    function cancelEdit() {
        document.getElementById('edit-id').value = "";
        document.getElementById('exp-date').valueAsDate = new Date();
        document.getElementById('exp-note').value = "";
        document.getElementById('exp-amount').value = "";
        document.getElementById('form-title').innerText = "💰 지출 기록";
        document.getElementById('save-btn').innerText = "지출 저장";
        document.getElementById('cancel-btn').style.display = "none";
    }
    
    function exportCSV(mode) {
        let filtered = transactions;
        if(mode === 'current') filtered = transactions.filter(t => t.date.startsWith(`${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}`));
        if(filtered.length === 0) return alert('데이터가 없습니다.');
        let csv = "\uFEFF날짜,항목,내용,금액\n";
        filtered.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(t => {
            const cat = categories.find(c => c.id === t.catId);
            csv += `${t.date},${cat ? cat.name : '미지정'},${t.note.replace(/,/g, '')},${t.amount}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
        link.download = `가계부_${mode==='all'?'전체':document.getElementById('display-month').innerText}.csv`;
        link.click();
    }
    
    function importCSV(input) {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            for(let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if(parts.length < 4) continue;
                let catId = categories.find(c => c.name === parts[1].trim())?.id || null;
                const id = Date.now() + Math.floor(Math.random()*1000);
                db.ref('transactions/' + id).set({ id, date: parts[0].trim(), note: parts[2].trim(), amount: parseInt(parts[3].trim()), catId });
            }
            alert('병합되었습니다.'); input.value = "";
        };
        reader.readAsText(file);
    }
    
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
    });

    window.onload = () => {
        loadTheme();
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('exp-date').value = today;
    }
</script>
